<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab Relay</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Tab Relay</h1>
  <div id="status" class="muted"></div>
  <button id="logout" class="link" title="Forget the token stored in this browser">Change token</button>
</header>

<section id="login" hidden>
  <form id="login-form">
    <p>Enter the server token (from <code>server/.env</code>, <code>TAB_RELAY_TOKEN</code>).</p>
    <input id="token-input" type="password" placeholder="token" autocomplete="off" required>
    <button type="submit">Connect</button>
    <p id="login-error" class="error"></p>
  </form>
</section>

<main id="app" hidden>
  <div id="toolbar">
    <span id="sel-count" class="muted">0 selected</span>
    <label>Target
      <select id="target"></select>
    </label>
    <label title="Open the tabs in a new window on the target"><input type="checkbox" id="new-window" checked> new window</label>
    <button id="btn-open">Open on target</button>
    <button id="btn-move">Move to target</button>
    <button id="btn-close" class="danger">Close on source</button>
    <button id="btn-snapshot">Save snapshot</button>
    <span class="spacer"></span>
    <input id="filter" type="search" placeholder="Filter tabs…">
    <button id="btn-expand" class="link">Expand all</button>
    <button id="btn-collapse" class="link">Collapse all</button>
  </div>
  <div id="msg"></div>

  <div id="layout">
    <div id="tree"></div>
    <aside>
      <h2>Snapshots</h2>
      <div id="snapshots" class="muted">No snapshots yet.</div>
      <h2>Recent commands</h2>
      <div id="commands" class="muted">None yet.</div>
    </aside>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
